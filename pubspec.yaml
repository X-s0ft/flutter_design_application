name: flutter_design_application
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/imgs/

  fonts: 
    - family: Satoshi_Regular
      fonts:
        - asset: lib/assets/font/Satoshi_Regular.otf

    - family: Satoshi_Medium
      fonts:
        - asset: lib/assets/font/Satoshi_Medium.otf

    - family: Satoshi_Bold
      fonts:
        - asset: lib/assets/font/Satoshi_Bold.otf